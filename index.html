<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헬스장 기구 투자 순위</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>헬스장 기구 투자 순위</h1>

  <section>
    <div class="map-wrap">
      <div id="map"></div>
      <aside class="brand-panel">
        <div class="brand-head">
          <strong>선호 브랜드</strong>
          <button id="reset-btn" type="button">리셋</button>
        </div>
        <div id="brand-list"></div>
        <p class="muted small">체크 시 ×<span id="bonus-rate"></span> 가산 (초안)</p>
      </aside>
    </div>
    <div class="row">
      <label for="radius">반경</label>
      <input type="range" id="radius" min="0.5" max="3" step="any" value="1">
      <output id="radius-out">1.0km</output>
    </div>
    <p class="muted" id="coord"></p>
  </section>

  <section>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>순위</th><th>업체명</th><th>점수</th><th>고유 모델 수</th><th>유효 사진 수</th><th>주요 브랜드</th><th>신뢰도</th></tr>
        </thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
    <ul id="excluded" class="muted"></ul>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
